name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Provision D1 / KV / R2 / Queues
        run: node scripts/provision-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply HRM_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Seed demo employees
        run: npx wrangler d1 execute HRM_DB --remote --file=./seed/demo.sql
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Enrich policy documents
        run: npx wrangler d1 execute HRM_DB --remote --file=./seed/policies_enrich.sql
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Do NOT re-run seed/auth_users.sql on every deploy — INSERT OR REPLACE
      # would reset production passwords to public demo hashes. First-time /
      # intentional reset only: npm run db:seed:auth:remote (local operator).
      - name: Sync Turnstile Siteverify secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Prefer TURNSTILE_SECRET_KEY (user-provided); fall back to TURNSTILE_SECRET
          TURNSTILE_SECRET_VALUE: ${{ secrets.TURNSTILE_SECRET_KEY || secrets.TURNSTILE_SECRET }}
        run: |
          if [ -z "${TURNSTILE_SECRET_VALUE}" ]; then
            echo "Missing GitHub Actions secret TURNSTILE_SECRET_KEY (or TURNSTILE_SECRET)"
            exit 1
          fi
          printf '%s' "${TURNSTILE_SECRET_VALUE}" | npx wrangler secret put TURNSTILE_SECRET
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
